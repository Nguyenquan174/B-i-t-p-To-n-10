<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ĐỀ KIỂM TRA ĐỊNH KỲ MÔN TOÁN THPT - Mã đề MD101</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['\\[', '\\]'], ['$$', '$$']] }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen p-4">
  <div class="max-w-6xl mx-auto space-y-4">
    <header class="bg-slate-900 text-white p-4 rounded-2xl flex flex-wrap justify-between items-center gap-3">
      <div>
        <span class="px-2 py-0.5 bg-amber-400 text-slate-950 font-bold text-xs rounded">MD101</span>
        <h1 class="text-lg font-extrabold mt-1">ĐỀ KIỂM TRA ĐỊNH KỲ MÔN TOÁN THPT</h1>
        <p class="text-xs text-slate-300">Trường THPT Tiên Du số 1 - Lớp 12A1 &bull; Giáo viên: Thầy Quân - Tổ Toán</p>
      </div>
      <div class="bg-slate-800 px-4 py-2 rounded-xl text-center">
        <div class="text-[10px] text-slate-400 uppercase">Thời gian còn lại</div>
        <div id="timer" class="font-mono text-xl font-extrabold text-emerald-400">00:45:00</div>
      </div>
    </header>
    <div id="studentInfoBar" class="bg-white p-4 rounded-2xl border border-slate-200 grid grid-cols-1 md:grid-cols-4 gap-3 text-xs">
      <input id="sId" placeholder="Mã học sinh / SBD *" class="px-3 py-2 border rounded-lg" />
      <input id="sName" placeholder="Họ và tên học sinh *" class="px-3 py-2 border rounded-lg" />
      <input id="sClass" placeholder="Lớp *" class="px-3 py-2 border rounded-lg" />
      <button id="btnStart" class="bg-blue-600 text-white font-bold rounded-lg py-2">Bắt đầu làm bài</button>
    </div>
    <div id="examArea" class="hidden grid grid-cols-1 lg:grid-cols-4 gap-4">
      <div id="qBox" class="lg:col-span-3 bg-white p-6 rounded-2xl border border-slate-200 space-y-4"></div>
      <div class="bg-white p-4 rounded-2xl border border-slate-200 space-y-3">
        <div class="font-bold text-xs uppercase">Bảng điều hướng</div>
        <div id="navGrid" class="grid grid-cols-5 gap-2"></div>
        <button id="btnSubmit" class="w-full py-2.5 bg-rose-600 text-white font-bold rounded-xl text-xs">NỘP BÀI</button>
      </div>
    </div>
    <div id="resultBox" class="hidden bg-emerald-50 border border-emerald-300 p-5 rounded-2xl text-sm font-bold text-emerald-950"></div>
  </div>
  <script>
    const CONFIG = {"title":"ĐỀ KIỂM TRA ĐỊNH KỲ MÔN TOÁN THPT","teacherName":"Thầy Quân - Tổ Toán","schoolClass":"Trường THPT Tiên Du số 1 - Lớp 12A1","examCode":"MD101","duration":45,"maxScore":10,"openTime":"2026-01-01T07:00","closeTime":"2027-12-31T23:59","instructions":"Học sinh đọc kỹ đề bài, kiểm tra đầy đủ các câu hỏi trong bảng điều hướng bên phải trước khi nhấn NỘP BÀI.","showAnswerMode":"after_submit","allowViewResult":true,"tfScoringMode":"partial_equal","shortAnsDecimalBoth":true,"shortAnsAllowFraction":true,"shortAnsAllowTolerance":false,"shortAnsTolerance":0.01,"allowRetake":false,"gasWebAppUrl":"","hostedBaseUrl":""};
    const QUESTIONS = [{"id":"Q1","number":1,"type":"choice","stem":"Cho hàm số $f(x)=x^2+2x+1$.\nGiá trị của $f(1)$ bằng bao nhiêu?","points":3.33,"required":true,"options":[{"label":"A","content":"$4$"},{"label":"B","content":"$2$"},{"label":"C","content":"$3$"},{"label":"D","content":"$5$"}],"statements":[],"choiceHash":"e40c292c","tfHashes":[],"shortHash":""},{"id":"Q2","number":2,"type":"choiceTF","stem":"Cho hàm số $f(x)=x^2$.","points":3.33,"required":true,"options":[],"statements":[{"key":"a","label":"a","content":"$f'(x)=2x$"},{"key":"b","label":"b","content":"$f(1)=0$"},{"key":"c","label":"c","content":"Hàm số đồng biến trên $(0;+\\infty)$"},{"key":"d","label":"d","content":"$f(x)$ là hàm số bậc nhất"}],"choiceHash":"","tfHashes":["4db211e5","0b069958","4db211e5","0b069958"],"shortHash":""},{"id":"Q3","number":3,"type":"shortans","stem":"Tính giá trị của biểu thức $A=2^3+3^2$.","points":3.33,"required":true,"options":[],"statements":[],"choiceHash":"","tfHashes":[],"shortHash":"1aeb28b1"}];
    let idx = 0, answers = {}, submitted = false, rem = (CONFIG.duration || 45) * 60;
    function h(s){let v=0x811c9dc5,c=String(s||'').trim().toLowerCase().replace(/,/g,'.').replace(/\s+/g,'');for(let i=0;i<c.length;i++){v^=c.charCodeAt(i);v=Math.imul(v,0x01000193);}return('0000000'+(v>>>0).toString(16)).slice(-8);}
    function render(){
      const q = QUESTIONS[idx];
      let html = '<div class="font-bold text-blue-700 text-xs">Câu ' + (idx+1) + ' (' + q.points + ' điểm)</div><div class="text-base font-medium">' + q.stem + '</div>';
      if(q.type==='choice'){
        html += q.options.map(o => '<button onclick="pickChoice(\''+q.id+'\',\''+o.label+'\')" class="w-full text-left p-3 my-1 border rounded-xl '+(answers[q.id]===o.label?'border-blue-600 bg-blue-50 font-bold':'')+'">'+o.label+'. '+o.content+'</button>').join('');
      } else if(q.type==='choiceTF'){
        const m = answers[q.id] || {};
        html += q.statements.map(s => '<div class="flex justify-between items-center p-2 border-b"><span><b>'+s.label+')</b> '+s.content+'</span><div class="space-x-1"><button onclick="pickTF(\''+q.id+'\',\''+s.key+'\',true)" class="px-3 py-1 rounded border '+(m[s.key]===true?'bg-blue-600 text-white':'')+'">Đúng</button><button onclick="pickTF(\''+q.id+'\',\''+s.key+'\',false)" class="px-3 py-1 rounded border '+(m[s.key]===false?'bg-rose-600 text-white':'')+'">Sai</button></div></div>').join('');
      } else {
        html += '<input oninput="answers[\''+q.id+'\']=this.value;renderNav();" value="'+(answers[q.id]||'')+'" placeholder="Nhập đáp số..." class="w-full px-3 py-2 border-2 border-teal-500 rounded-xl font-mono" />';
      }
      html += '<div class="flex justify-between pt-4"><button onclick="if(idx>0){idx--;render();}" class="px-4 py-1.5 border rounded-lg text-xs font-bold">Câu trước</button><button onclick="if(idx<QUESTIONS.length-1){idx++;render();}" class="px-4 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-bold">Câu tiếp</button></div>';
      document.getElementById('qBox').innerHTML = html;
      renderNav();
      if(window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise();
    }
    function renderNav(){
      document.getElementById('navGrid').innerHTML = QUESTIONS.map((q,i) => '<button onclick="idx='+i+';render();" class="h-9 rounded font-bold text-xs '+(answers[q.id]?'bg-blue-600 text-white':'bg-slate-200')+'">'+(i+1)+'</button>').join('');
    }
    window.pickChoice = (qid,val)=>{if(!submitted){answers[qid]=val;render();}};
    window.pickTF = (qid,k,val)=>{if(!submitted){answers[qid]=answers[qid]||{};answers[qid][k]=val;render();}};
    document.getElementById('btnStart').onclick = ()=>{
      document.getElementById('examArea').classList.remove('hidden');
      render();
      setInterval(()=>{if(!submitted && rem>0){rem--;document.getElementById('timer').textContent=[Math.floor(rem/3600),Math.floor((rem%3600)/60),rem%60].map(v=>String(v).padStart(2,'0')).join(':');if(rem===0)document.getElementById('btnSubmit').click();}},1000);
    };
    document.getElementById('btnSubmit').onclick = async ()=>{
      if(submitted) return; submitted = true;
      let earned = 0, total = 0;
      QUESTIONS.forEach(q => {
        total += Number(q.points||1);
        if(q.type==='choice' && h(answers[q.id])===q.choiceHash) earned += Number(q.points||1);
        else if(q.type==='choiceTF'){
          const m = answers[q.id]||{}; let c=0;
          q.statements.forEach((s,si)=>{if(m[s.key]!==undefined && h(String(m[s.key]))===q.tfHashes[si]) c++;});
          earned += (Number(q.points||1)*c)/4;
        } else if(q.type==='shortans' && h(answers[q.id])===q.shortHash) earned += Number(q.points||1);
      });
      const score = total>0 ? ((earned/total)*(CONFIG.maxScore||10)).toFixed(2) : '0.00';
      const box = document.getElementById('resultBox');
      box.classList.remove('hidden');
      box.textContent = 'Đã nộp bài thành công! Điểm đạt được: ' + score + ' / ' + (CONFIG.maxScore||10);
      if(CONFIG.gasWebAppUrl){
        try{await fetch(CONFIG.gasWebAppUrl,{method:'POST',body:JSON.stringify({action:'submitExam',studentId:document.getElementById('sId').value,studentName:document.getElementById('sName').value,className:document.getElementById('sClass').value,examCode:CONFIG.examCode,answers})});}catch(e){}
      }
    };
  </script>
</body>
</html>
